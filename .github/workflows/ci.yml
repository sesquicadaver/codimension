# CI: independent static gates, pytest matrix, wheel install, offscreen GUI smoke
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # Independent static jobs so one failure does not hide the others (audit P0).
  ruff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
            constraints.txt
            pyproject.toml
      - name: Install lint extras
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -c constraints.txt -e ".[lint]"
      - name: Ruff check
        run: |
          . .venv/bin/activate
          ruff check codimension cdmplugins

  ruff-format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
            constraints.txt
            pyproject.toml
      - name: Install lint extras
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -c constraints.txt -e ".[lint]"
      - name: Ruff format check
        run: |
          . .venv/bin/activate
          ruff format --check codimension cdmplugins

  mypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
            constraints.txt
            pyproject.toml
      - name: Install lint extras
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -c constraints.txt -e ".[lint]"
      - name: Mypy
        run: |
          . .venv/bin/activate
          mypy $(find codimension cdmplugins -name '*.py' ! -path '*/flowui/everything.py')

  import-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
            constraints.txt
            pyproject.toml
      - name: Install and run T072/T085 gates
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -c constraints.txt -e ".[lint]"
          python scripts/check_package_relative_imports.py
          python scripts/check_core_import_graph.py
          python scripts/check_constraints.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
            constraints.txt
            pyproject.toml

      - name: Install and pytest
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -c constraints.txt -e ".[test,tools,security]"
          pip check
          echo "::group::Debugger session e2e (offscreen)"
          QT_QPA_PLATFORM=offscreen pytest tests/debugger/ -m debugger_session -v --tb=short
          echo "::endgroup::"
          pytest tests/ -v --tb=short

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
            constraints.txt
            pyproject.toml

      - name: Build wheel and clean-venv install
        run: |
          python -m venv .venv-build
          . .venv-build/bin/activate
          pip install --upgrade pip build
          python -m build --wheel
          deactivate
          python -m venv .venv-wheel
          . .venv-wheel/bin/activate
          pip install --upgrade pip
          pip install -c constraints.txt dist/codimension-*.whl
          pip check
          python -c "import codimension; print(codimension.__file__)"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
            constraints.txt
            pyproject.toml

      - name: Install, import, pip-audit, offscreen GUI smoke
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -c constraints.txt -r requirements.txt
          pip install -c constraints.txt -e .
          python -c "import codimension; import cdmplugins; print('OK')"
          pip install -c constraints.txt pip-audit
          pip-audit -r requirements.txt
          QT_QPA_PLATFORM=offscreen python scripts/offscreen_gui_smoke.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Markdown link and README invariants
        run: |
          python scripts/check_docs.py
          python scripts/check_constraints.py

  # Single required status for branch protection (G01).
  ci-gate:
    if: always()
    needs:
      - ruff
      - ruff-format
      - mypy
      - import-gates
      - test
      - wheel
      - smoke
      - docs
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs success
        run: |
          set -euo pipefail
          results=(
            "${{ needs.ruff.result }}"
            "${{ needs.ruff-format.result }}"
            "${{ needs.mypy.result }}"
            "${{ needs.import-gates.result }}"
            "${{ needs.test.result }}"
            "${{ needs.wheel.result }}"
            "${{ needs.smoke.result }}"
            "${{ needs.docs.result }}"
          )
          for r in "${results[@]}"; do
            echo "need result: $r"
            if [ "$r" != "success" ]; then
              echo "ci-gate failed: required job result=$r"
              exit 1
            fi
          done
          echo "ci-gate OK"
