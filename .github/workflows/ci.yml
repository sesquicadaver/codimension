# CI: ruff, mypy, pytest matrix, wheel install, offscreen GUI smoke
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Create venv and install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[lint]"

      - name: T072 package-relative import gate
        run: |
          . .venv/bin/activate
          python scripts/check_package_relative_imports.py

      - name: T085 core import-graph gate
        run: |
          . .venv/bin/activate
          python scripts/check_core_import_graph.py

      - name: Ruff check (codimension, cdmplugins)
        run: |
          . .venv/bin/activate
          ruff check codimension cdmplugins

      - name: Ruff format (check only)
        run: |
          . .venv/bin/activate
          ruff format --check codimension cdmplugins

      - name: Mypy (codimension, cdmplugins)
        run: |
          . .venv/bin/activate
          mypy $(find codimension cdmplugins -name '*.py' ! -path '*/flowui/everything.py')

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install and pytest
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[test,tools,security]"
          pip check
          # T103: named gate first for clear CI logs. Full suite below re-runs the
          # same debugger_session tests (~8 after T120; accepted duplicate).
          echo "::group::Debugger session e2e (offscreen)"
          QT_QPA_PLATFORM=offscreen pytest tests/debugger/ -m debugger_session -v --tb=short
          echo "::endgroup::"
          pytest tests/ -v --tb=short

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Build wheel and clean-venv install
        run: |
          python -m venv .venv-build
          . .venv-build/bin/activate
          pip install --upgrade pip build
          python -m build --wheel
          deactivate
          python -m venv .venv-wheel
          . .venv-wheel/bin/activate
          pip install --upgrade pip
          pip install dist/codimension-*.whl
          pip check
          python -c "import codimension; print(codimension.__file__)"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install, import, pip-audit, offscreen GUI smoke
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          python -c "import codimension; import cdmplugins; print('OK')"
          pip install pip-audit
          pip-audit -r requirements.txt
          QT_QPA_PLATFORM=offscreen python scripts/offscreen_gui_smoke.py
