# CI: ruff, mypy у venv. Відповідно до doc/plugins/plugins-implementation-plan.md
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Create venv and install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e .
          pip install ruff mypy

      - name: Ruff check (codimension, cdmplugins)
        run: |
          . .venv/bin/activate
          ruff check codimension cdmplugins

      - name: Ruff format (check only)
        run: |
          . .venv/bin/activate
          ruff format --check codimension cdmplugins

      - name: Mypy (cdmplugins)
        run: |
          . .venv/bin/activate
          mypy $(find cdmplugins -name '*.py')

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install and smoke test
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e .
          # Import check (no display required); codimension --help needs X11
          python -c "import codimension; import cdmplugins; print('OK')"

      - name: pip-audit (vulnerabilities)
        run: |
          . .venv/bin/activate
          pip install pip-audit
          # Audit project deps only (not pip-audit's own fastapi/starlette stack).
          # mistune is pinned <2.0 — API incompatible with 2.x/3.x (see requirements.txt).
          pip-audit -r requirements.txt \
            --ignore-vuln PYSEC-2026-168 \
            --ignore-vuln CVE-2026-44708 \
            --ignore-vuln CVE-2026-44897

      - name: Pytest (plugin tests)
        run: |
          . .venv/bin/activate
          pip install pytest
          pytest tests/ -v --tb=short
