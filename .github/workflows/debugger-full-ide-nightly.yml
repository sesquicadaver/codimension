# T130: optional full-IDE MainWindow debugger smoke (not a PR blocker)
name: Debugger full-IDE nightly

on:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  full-ide-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install and run full-IDE smoke
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[test,tools,security]"
          pip check
          CDM_FULL_IDE_SMOKE=1 QT_QPA_PLATFORM=offscreen \
            pytest tests/debugger/test_full_ide_smoke.py -m full_ide -v --tb=short
